name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::090213310133:role/LabGitHubDeploy
          aws-region: ap-northeast-3
      - name: Deploy
        run: >-
          aws lambda-web deploy
          --name poc-app
          --code ./app
          --execution-role-arn arn:aws:iam::090213310133:role/LabLambdaExec
